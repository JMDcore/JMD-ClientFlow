name: Reportar un error
description: Informa de un comportamiento reproducible que no funciona como se espera.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Gracias por ayudar a mejorar ClientFlow.
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica qué ocurre y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre...
        2. Pulsa...
        3. Observa...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y versión
      placeholder: Chrome 126, Safari 18...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia adicional
      description: Añade capturas o mensajes de consola sin incluir datos sensibles.
